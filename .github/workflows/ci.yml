name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test and build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Package app bundle
        run: ./build-app.sh
